name: 📱 Android APK

# Builds the Laukolaroser Android app (android/) and publishes it as the
# "android-latest" pre-release, so a phone can download it from
# https://github.com/<owner>/<repo>/releases/tag/android-latest
on:
  push:
    branches: [main, ccr-f2fe3bd8-k0h6kk]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Collect
        run: cp android/app/build/outputs/apk/debug/app-debug.apk laukolaroser.apk
      - uses: actions/upload-artifact@v7
        with:
          name: laukolaroser-apk
          path: laukolaroser.apk
      - name: Publish the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest laukolaroser.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Laukolaroser for Android (latest build)" \
            --notes "Install: open this page on your Android phone, download laukolaroser.apk, open it and allow installing from this source. On first launch enter your server address (e.g. http://192.168.1.20:8080). Built from ${GITHUB_SHA::7}."
